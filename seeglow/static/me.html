<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f59e0b">
<title>我的主页 · 拾光 SeeGlow</title>
<style>
:root{--brand:#f59e0b;--brand2:#f97316;--ink:#18181b;--sub:#71717a;--line:#e4e4e7;--bg:#fffdf8;
  --grad:linear-gradient(135deg,#f59e0b,#f97316);--err:#dc2626;--ok:#15803d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:#fff;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 70px}
nav{border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:20}
nav .wrap{max-width:900px;display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px}
.btn{display:inline-block;border-radius:11px;padding:9px 20px;font-size:13.5px;font-weight:600;
  cursor:pointer;border:none;font-family:inherit;transition:.15s;text-align:center}
.btn.pri{background:var(--grad);color:#fff}
.btn.pri:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#c4c4c8}
.btn.danger{background:#fef2f2;border:1.5px solid #fecaca;color:var(--err)}
.btn.danger:hover{background:#fee2e2}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* profile hero */
.hero{background:var(--grad);color:#fff;border-radius:0 0 26px 26px;padding:34px 20px 30px;text-align:center}
.avatar{width:76px;height:76px;border-radius:99px;margin:0 auto 12px;display:grid;place-items:center;
  background:rgba(255,255,255,.22);font-size:32px;font-weight:800;border:3px solid rgba(255,255,255,.55)}
.hero h1{font-size:22px}
.hero .plan{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);border-radius:99px;
  padding:4px 18px;font-size:13px}
.hero .exp{margin-top:6px;font-size:12.5px;opacity:.9}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:15px;border-radius:3px;background:var(--grad)}

/* quota */
.quota-row{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.qdot{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;
  font-weight:700;color:#c4c4c8;font-size:13px}
.qdot.used{background:var(--grad);border-color:transparent;color:#fff}
.qnote{text-align:center;font-size:12.5px;color:var(--sub)}

/* membership */
.mem-ok{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px 18px;
  color:var(--ok);font-size:14px;text-align:center}
.mem-cta{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.mem-cta .btn{flex:1;min-width:180px}
.hint{font-size:12.5px;color:var(--sub);margin-top:8px}
.hint a{color:#c2620a}

/* forms */
.frow{margin-bottom:14px}
.frow label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.frow input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;
  padding:9px 13px;font-size:14px;outline:none;font-family:inherit}
.frow input:focus{border-color:var(--brand);background:#fffdf8}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px;
  font-size:13px;cursor:pointer;font-family:inherit;color:var(--sub)}
.tab.on{border-color:var(--brand);color:#b45309;font-weight:600;background:#fffbeb}
#meMsg{font-size:13px;min-height:18px;margin:4px 0}
.ok{color:var(--ok)}.bad{color:var(--err)}

/* notes */
.note-item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;margin-bottom:9px;transition:.15s}
.note-item:hover{border-color:#fdba74;background:#fffdf8}
.note-item .t{flex:1;min-width:0}
.note-item .t .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .t .d{font-size:11.5px;color:#a1a1aa}
.note-item .btn{padding:6px 14px;font-size:12px;border-radius:9px}
.empty{text-align:center;color:#a1a1aa;font-size:13px;padding:18px 0}
@media(max-width:560px){.mem-cta{flex-direction:column}}
</style>
</head>
<body>

<nav><div class="wrap">
  <a class="brand" href="/">
    <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="36" y2="36">
        <stop stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs>
      <rect width="36" height="36" rx="10" fill="url(#lg)"/>
      <path d="M11 21 a 7 7 0 0 1 14 0" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <line x1="18" y1="8.5" x2="18" y2="11.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="10.5" y1="25" x2="25.5" y2="25" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    拾光 SeeGlow
  </a>
  <a class="btn pri sm" href="/app">← 返回应用</a>
</div></nav>

<div class="hero">
  <div class="avatar" id="avatar">拾</div>
  <h1 id="uname">加载中…</h1>
  <div class="plan" id="planBadge">…</div>
  <div class="exp" id="expLine"></div>
</div>

<div class="wrap">
  <div class="card" id="quotaCard">
    <h2>今日体验额度</h2>
    <div class="quota-row" id="quotaRow"></div>
    <div class="qnote" id="quotaNote"></div>
  </div>

  <div class="card" id="memCard">
    <h2>会员与激活</h2>
    <div id="memBody"></div>
  </div>

  <div class="card">
    <h2>我的笔记</h2>
    <div id="noteList"><div class="empty">加载中…</div></div>
    <div class="hint">笔记与你的账号绑定：换手机、换电脑登录后都在这里。</div>
  </div>

  <div class="card">
    <h2>账号</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn danger" onclick="doLogout()">退出登录</button>
      <a class="btn ghost" href="/app">返回应用</a>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const SESSION=localStorage.getItem("seeglowSession")||"";
const HDR=SESSION?{"X-SeeGlow-Session":SESSION}:{};
let ME=null;

async function boot(){
  if(!SESSION){location.href="/app";return}
  const r=await fetch("/api/auth/me",{headers:HDR});const me=await r.json();
  if(!me.user){location.href="/app";return}
  ME=me;
  $("uname").textContent=me.user;
  $("avatar").textContent=me.user.slice(0,1).toUpperCase();
  renderPlan();
  renderQuota();
  renderMem();
  loadNotes();
}
function renderPlan(){
  const b=$("planBadge"),e=$("expLine");
  if(ME.licensed){b.textContent=ME.plan==="code"?"🎫 永久/激活码会员":"👑 爱发电订阅会员";e.textContent="有效期至 "+ME.expiry}
  else{b.textContent="🆓 免费体验用户";e.textContent="每日 "+ME.trial_per_day+" 次免费额度，次日自动恢复"}
}
function renderQuota(){
  const row=$("quotaRow"),note=$("quotaNote"),card=$("quotaCard");
  if(ME.licensed){card.style.display="none";return}
  row.innerHTML="";
  const left=ME.uses_left??0,total=ME.trial_per_day||3;
  for(let i=0;i<total;i++){
    const d=document.createElement("div");
    d.className="qdot"+(i<left?"":" used");
    d.textContent=left>0&&i<left?"✓":"×";
    row.appendChild(d);
  }
  note.textContent=left>0?`今天还能生成 ${left} 次（明日自动恢复）`:"今天额度已用完，明天自动恢复，或开通会员不限次数";
}
function renderMem(){
  const b=$("memBody");
  if(ME.licensed){
    b.innerHTML=`<div class="mem-ok">✅ 会员已开通 · 有效期至 <b>${ME.expiry}</b> · 所有功能不限次数<br>
      <span style="font-size:12px;color:var(--sub)">会员与账号绑定，任何设备登录即生效</span></div>`;
    return;
  }
  b.innerHTML=`
    <div class="tabs">
      <button class="tab on" id="tabOrder" onclick="switchTab('order')">爱发电订单激活</button>
      <button class="tab" id="tabCode" onclick="switchTab('code')">激活码激活</button>
    </div>
    <div id="orderPane">
      <div class="frow"><label>赞助订单号（爱发电 → 头像菜单 → 我的订单）</label>
        <input id="orderNo" placeholder="粘贴订单号，¥29.9/月档及以上"></div>
      <button class="btn pri" onclick="doOrder()">在线验证并开通</button>
      <div class="hint">还没赞助？前往 <a href="https://afdian.com/a/Orisyan" target="_blank">afdian.com/a/Orisyan</a> · 订单号仅买家可见，秒验证</div>
    </div>
    <div id="codePane" style="display:none">
      <div class="frow"><label>激活码（私信向作者获取；一码多设备通用）</label>
        <input id="codeVal" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" style="font-family:Consolas,monospace"></div>
      <button class="btn pri" onclick="doCode()">激活并绑定本账号</button>
    </div>
    <div id="meMsg"></div>`;
}
function switchTab(t){
  $("tabOrder").classList.toggle("on",t==="order");
  $("tabCode").classList.toggle("on",t==="code");
  $("orderPane").style.display=t==="order"?"":"none";
  $("codePane").style.display=t==="code"?"":"none";
}
async function post(url,body){
  const r=await fetch(url,{method:"POST",headers:{...HDR,"Content-Type":"application/json"},
    body:JSON.stringify(body)});
  return r.json();
}
async function doOrder(){
  const v=$("orderNo").value.trim();const m=$("meMsg");
  if(!v){m.textContent="请输入订单号";m.className="bad";return}
  m.textContent="验证中…（首次冷启动约 30 秒）";m.className="";
  const d=await post("/api/pro/order",{order_no:v});
  if(d.ok){m.textContent=`开通成功！有效期至 ${d.expiry}`;m.className="ok";setTimeout(()=>location.reload(),1400)}
  else{m.textContent=d.error||"验证失败";m.className="bad"}
}
async function doCode(){
  const v=$("codeVal").value.trim();const m=$("meMsg");
  if(!v){m.textContent="请输入激活码";m.className="bad";return}
  m.textContent="激活中…";m.className="";
  const d=await post("/api/pro/code",{code:v});
  if(d.ok){m.textContent=`激活成功！${d.expiry>="9000"?"永久有效":("有效期至 "+d.expiry)}`;m.className="ok";
    setTimeout(()=>location.reload(),1400)}
  else{m.textContent=d.error||"激活失败";m.className="bad"}
}
async function loadNotes(){
  const el=$("noteList");
  try{
    const r=await fetch("/api/history",{headers:HDR});
    if(!r.ok){el.innerHTML='<div class="empty">登录后可查看我的笔记</div>';return}
    const list=await r.json();
    if(!list.length){el.innerHTML='<div class="empty">还没有笔记 —— 去应用里总结第一支视频吧</div>';return}
    el.innerHTML=list.map(f=>{
      const d=new Date(f.mtime*1000);
      return `<div class="note-item"><div class="t">
        <div class="n">${f.name.replace(/\\.md$/,"").replace(/^\\d{8}-/,"")}</div>
        <div class="d">${d.toLocaleDateString()} · ${(f.size/1024).toFixed(1)} KB</div></div>
        <button class="btn pri" onclick="openNote('${encodeURIComponent(f.name)}')">打开</button></div>`;
    }).join("");
  }catch(e){el.innerHTML='<div class="empty">加载失败</div>'}
}
function openNote(enc){
  localStorage.setItem("openNote",enc);
  location.href="/app";
}
async function doLogout(){
  await fetch("/api/auth/logout",{method:"POST",headers:HDR}).catch(()=>{});
  localStorage.removeItem("seeglowSession");
  location.href="/";
}
boot();
</script>
</body>
</html>
