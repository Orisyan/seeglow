<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f4f5">
<title>拾光 SeeGlow · B站长视频总结</title>
<style>
:root{
  --bg:#f4f4f5; --card:#ffffff; --ink:#18181b; --sub:#71717a; --line:#e4e4e7;
  --accent:#f59e0b; --accent2:#f97316; --err:#dc2626; --hover:#fafafa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 80px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0;margin-bottom:34px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo .name{font-size:20px;font-weight:700;letter-spacing:.04em;line-height:1.15}
.logo .en{font-size:10.5px;letter-spacing:.3em;color:var(--sub)}
.btn-chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 20px;font-size:13.5px;color:var(--sub);cursor:pointer;font-family:inherit;transition:.15s}
.btn-chip:hover{color:var(--ink);border-color:#c4c4c8}
.btn-chip.warn{color:#b45309;border-color:#fcd34d;background:#fffbeb}
.btn-chip.ok{color:#15803d;border-color:#bbf7d0;background:#f0fdf4}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 8px 28px -14px rgba(0,0,0,.08)}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px}
@media(max-width:860px){.grid{grid-template-columns:1fr}.grid aside{display:none}}

/* ask card */
.ask-card{padding:26px}
.ask{display:flex;gap:12px}
.ask input{flex:1;background:var(--hover);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:15.5px;color:var(--ink);outline:none;font-family:inherit;transition:border-color .15s, background .15s}
.ask input::placeholder{color:#a1a1aa}
.ask input:focus{border-color:var(--accent);background:#fffdf8}
.ask .go{flex-shrink:0;border:none;border-radius:12px;padding:0 30px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit;letter-spacing:.06em;
  background:linear-gradient(135deg,var(--accent),var(--accent2));transition:filter .15s, transform .05s}
.ask .go:hover{filter:brightness(1.06)}
.ask .go:active{transform:scale(.98)}
.ask .go:disabled{opacity:.45;cursor:not-allowed}
.hint{margin-top:14px;font-size:12.5px;color:#a1a1aa}

.picker{display:none;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;background:var(--hover);border:1px dashed var(--accent);padding:12px 14px;border-radius:12px}
.picker .pinfo{font-size:13px;color:var(--sub)}
.picker select{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--ink);max-width:300px;font-family:inherit;outline:none}
.picker select:focus{border-color:var(--accent)}
.picker button{border:none;border-radius:9px;padding:8px 18px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));font-family:inherit}
.picker button:hover{filter:brightness(1.06)}
.picker button.alt{background:var(--card);color:var(--sub);border:1.5px solid var(--line);font-weight:500}
.file-btn{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--sub);cursor:pointer;font-family:inherit}
.file-btn:hover{color:var(--ink);border-color:#c4c4c8}
.err{margin-top:16px;background:#fef2f2;border:1px solid #fecaca;color:var(--err);padding:12px 16px;border-radius:12px;font-size:13.5px;line-height:1.7;display:none;white-space:pre-wrap}

/* progress */
.prog{display:none;padding:6px 2px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline}
.prog .stage{font-size:14px;font-weight:600}
.prog .pct{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease}
.prog .msg{margin-top:10px;font-size:12.5px;color:var(--sub);min-height:18px}
.stop{margin-top:10px;background:none;border:none;color:var(--sub);font-size:12.5px;cursor:pointer;padding:0;font-family:inherit}
.stop:hover{color:var(--err)}

/* result */
.result{display:none;margin-top:22px;padding:26px}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rhead h2{font-size:16.5px;font-weight:700;line-height:1.5}
.acts{flex-shrink:0;display:flex;gap:8px}
.acts button{background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:6px 13px;font-size:12.5px;color:var(--sub);cursor:pointer;font-family:inherit}
.acts button:hover{color:var(--ink);border-color:#c4c4c8}

/* markdown */
.md{margin-top:16px;font-size:14.5px}
.md h1{font-size:20px;font-weight:700;margin:22px 0 6px;line-height:1.45}
.md h2{font-size:15px;font-weight:700;margin:26px 0 8px;display:flex;align-items:center;gap:9px}
.md h2::before{content:"";width:4px;height:15px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));flex-shrink:0}
.md h3{font-size:14px;font-weight:600;margin:16px 0 6px}
.md p{margin:9px 0;color:#27272a}
.md ul,.md ol{padding-left:0;margin:10px 0;list-style:none}
.md li{position:relative;padding-left:18px;margin:7px 0;color:#27272a}
.md li::before{content:"–";position:absolute;left:0;color:var(--accent2);font-weight:600}
.md blockquote{background:var(--hover);border-left:3px solid var(--accent);padding:9px 14px;margin:10px 0;border-radius:0 8px 8px 0;color:var(--sub)}
.md code{background:var(--hover);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px;font-family:"Cascadia Code",Consolas,monospace}
.md pre{background:var(--hover);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;margin:10px 0}
.md pre code{background:none;border:none;padding:0}
.md a{color:#c2620a;text-decoration:none;border-bottom:1px solid #fcd34d}
.md hr{border:none;border-top:1px solid var(--line);margin:24px 0}
.md details{margin:20px 0}
.md summary{cursor:pointer;font-size:13px;color:var(--sub);background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:7px 13px;display:inline-block}
.md summary:hover{color:var(--ink)}

/* aside */
aside{position:sticky;top:20px;align-self:start}
.side-card{padding:20px}
.cap{font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--sub);margin-bottom:12px}
.h-item{padding:9px 11px;margin:0 -11px;border-radius:10px;cursor:pointer;transition:background .15s}
.h-item:hover{background:var(--hover)}
.h-item .t{font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.h-item .d{font-size:11px;color:#a1a1aa;margin-top:2px}
.empty{font-size:12.5px;color:#a1a1aa}

/* dialog */
dialog{background:var(--card);color:var(--ink);border:none;border-radius:18px;padding:32px;width:min(480px,92vw);box-shadow:0 24px 70px rgba(0,0,0,.22)}
dialog::backdrop{background:rgba(24,24,27,.35)}
dialog h3{font-size:16px;font-weight:700;margin-bottom:22px}
.frow{margin-bottom:18px}
.frow label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
.frow input,.frow select{width:100%;background:var(--hover);border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;font-size:14px;color:var(--ink);outline:none;font-family:inherit;transition:border-color .15s}
.frow select{cursor:pointer}
.frow input:focus,.frow select:focus{border-color:var(--accent);background:#fffdf8}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.dlg-foot button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 20px;font-size:13.5px;color:var(--sub);cursor:pointer;font-family:inherit}
.dlg-foot button.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;font-weight:600}
.dlg-foot button:hover{filter:brightness(.97)}

.qa{display:none;margin-top:22px;padding:22px 26px}
.qa .msgs{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:12px;margin:14px 0}
.bub{max-width:88%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.bub.u{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--hover);border:1px solid var(--line);border-bottom-left-radius:4px}
.qrow{display:flex;gap:10px;margin-top:4px}
.qrow input{flex:1;background:var(--hover);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink);outline:none;font-family:inherit}
.qrow input:focus{border-color:var(--accent)}
.qrow button{border:none;border-radius:10px;padding:0 20px;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));font-family:inherit}
.note{margin-top:26px;font-size:12.5px;color:#a1a1aa;line-height:2}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">
      <svg width="40" height="40" viewBox="0 0 36 36" fill="none">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="36" y2="36"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs>
        <rect width="36" height="36" rx="10" fill="url(#lg)"/>
        <path d="M11 21 a 7 7 0 0 1 14 0" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <line x1="18" y1="8.5" x2="18" y2="11.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="9.5" y1="12.5" x2="11.6" y2="14.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="26.5" y1="12.5" x2="24.4" y2="14.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="10.5" y1="25" x2="25.5" y2="25" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span>
        <span class="name">拾光</span><br>
        <span class="en">S E E G L O W</span>
      </span>
    </a>
    <span style="display:flex;gap:10px;align-items:center">
      <button class="btn-chip" id="feedChip" onclick="openFeed()" style="display:none">追更</button>
      <button class="btn-chip" id="proChip" style="display:none" onclick="openActivate()">试用</button>
      <button class="btn-chip" onclick="openSettings()">设置</button>
    </span>
  </header>

  <div class="grid">
    <main>
      <div class="card ask-card">
        <div class="ask" id="askRow">
          <input id="url" placeholder="粘贴 B 站视频链接或 BV 号，一键生成总结笔记" autocomplete="off"
                 onkeydown="if(event.key==='Enter')start()">
          <button class="go" id="startBtn" onclick="start()">开始总结</button>
        </div>
        <div class="hint" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span>支持链接 / BV 号 / av 号 / b23.tv 短链 / 合集与收藏夹链接 · 总结仅保存在本机</span>
          <span style="display:flex;gap:8px;align-items:center">
            <select id="styleSel" style="background:var(--hover);border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12.5px;color:var(--sub);font-family:inherit;outline:none;cursor:pointer">
              <option value="general">通用笔记</option>
              <option value="study">学习笔记</option>
              <option value="tutorial">教程步骤</option>
              <option value="meeting">会议纪要</option>
              <option value="review">轻松杂谈</option>
            </select>
            <button class="file-btn" onclick="fileInput.click()">📁 本地音视频</button>
            <input type="file" id="fileInput" style="display:none"
                   accept=".mp4,.mkv,.flv,.mov,.avi,.webm,.mp3,.m4a,.wav,.flac,.aac,.ogg,.m4s,.ts"
                   onchange="if(this.files[0])uploadFile(this.files[0]);this.value=''">
          </span>
        </div>

        <div class="picker" id="pagePicker">
          <span class="pinfo" id="pageInfo"></span>
          <select id="pageSel"></select>
          <button onclick="startRun(false)">总结选中的P</button>
          <button class="alt" onclick="startRun(true)">总结全部P</button>
        </div>

        <div class="picker" id="colPicker" style="flex-direction:column;align-items:stretch">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <span class="pinfo" id="colInfo"></span>
            <span style="display:flex;gap:8px">
              <button class="alt" style="border:none;border-radius:9px;padding:8px 18px;font-size:13px;font-weight:500;color:var(--sub);background:var(--card);border:1.5px solid var(--line);cursor:pointer;font-family:inherit" onclick="colSelectAll()">全选 / 反选</button>
              <button onclick="startBatchFromPicker()">批量总结选中项</button>
              <button class="alt" style="border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--sub);background:var(--card);border:1.5px solid var(--line);cursor:pointer;font-family:inherit" onclick="colPicker.style.display='none';$('url').value=''">收起</button>
            </span>
          </div>
          <div id="colList" style="max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px"></div>
        </div>

        <div class="prog" id="progressCard">
          <div class="row"><span class="stage" id="stageLabel">准备中…</span><span class="pct" id="pPct">0%</span></div>
          <div class="bar"><i id="barFill"></i></div>
          <div class="msg" id="pMsg"></div>
          <button class="stop" onclick="stopTask()">取消任务</button>
        </div>

        <div class="err" id="errBox"></div>
      </div>

      <div class="card result" id="resultCard">
        <div class="rhead">
          <h2 id="resultTitle">总结</h2>
          <div class="acts">
            <button onclick="copyResult()">复制 Markdown</button>
            <button onclick="downloadResult()">下载 .md</button>
            <button onclick="exportOPML()">导图 .opml</button>
            <button id="cardBtn" onclick="makeFlashcards()">闪卡 .txt</button>
          </div>
        </div>
        <div id="dmWrap" style="display:none;margin-top:14px">
          <div style="font-size:12px;color:var(--sub);display:flex;justify-content:space-between">
            <span>弹幕高能时间轴 <span id="dmTotal"></span></span><span id="dmHot" style="color:#c2620a"></span>
          </div>
          <div id="dmStrip" style="display:flex;gap:1px;height:26px;margin-top:6px;border-radius:6px;overflow:hidden;cursor:pointer" title="点击色块跳转到对应时间点"></div>
        </div>
        <div class="md" id="mdBody"></div>
      </div>

      <div class="card qa" id="qaCard">
        <h2 style="font-size:15px">AI 问答 <span style="font-weight:400;color:var(--sub);font-size:12px">基于本视频内容 · 回答引用时间点</span></h2>
        <div class="msgs" id="qaMsgs"></div>
        <div class="qrow">
          <input id="qInput" placeholder="例如：XX概念在视频哪里提到？我这么理解对不对？" onkeydown="if(event.key==='Enter')ask()">
          <button onclick="ask()">发送</button>
        </div>
      </div>

      <div class="note">
        工作流程 —— 获取B站字幕；无字幕时由多模态大模型直接聆听音频，生成结构化笔记。
        首次使用请在右上角「设置」中填入 API Key。
      </div>
    </main>

    <aside>
      <div class="card side-card">
        <div class="cap">历 史 记 录</div>
        <div id="historyList"><div class="empty">暂无记录</div></div>
      </div>
    </aside>
  </div>
</div>

<dialog id="actDlg">
  <h3 id="actTitle">激活拾光</h3>
  <div class="frow"><label>本机机器码（发私信给作者可获取激活码）</label>
    <div style="display:flex;gap:8px">
      <input id="actMc" readonly style="flex:1;font-family:Consolas,monospace;letter-spacing:.08em;background:var(--hover)">
      <button type="button" onclick="copyMc()" style="flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 16px;font-size:12.5px;color:var(--sub);cursor:pointer;font-family:inherit">复制</button>
    </div></div>
  <div class="frow"><label>激活码（赞助后作者回复给你）</label>
    <input id="actCode" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" style="font-family:Consolas,monospace;letter-spacing:.05em"
           onkeydown="if(event.key==='Enter')doActivate('code')"></div>
  <div id="actOnlineRow" style="display:none">
    <div style="border-top:1px solid var(--line);margin:20px 0 14px"></div>
    <div class="frow"><label>或：赞助订单号在线验证（秒开）</label>
      <input id="actOrder" placeholder="爱发电 → 头像菜单 → 我的订单"
             onkeydown="if(event.key==='Enter')doActivate('order')"></div>
  </div>
  <div id="actMsg" style="min-height:20px;font-size:13px;margin-top:6px"></div>
  <div class="dlg-foot">
    <button onclick="actDlg.close()">关闭</button>
    <button class="pri" id="actBtn" onclick="doActivate('code')">激 活</button>
  </div>
  <div class="note" style="margin-top:18px">赞助 ¥9.9/月起 · <a href="https://afdian.com/a/Orisyan" target="_blank" style="color:#c2620a">爱发电主页</a> · 免费试用 3 次</div>
</dialog>

<dialog id="feedDlg">
  <h3>追更 · UP主新视频检查</h3>
  <div class="frow"><label>UP主主页链接或 uid（每行一个，保存在本机）</label>
    <textarea id="feedUps" rows="3" style="width:100%;background:var(--hover);border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13.5px;color:var(--ink);outline:none;font-family:inherit;resize:vertical" placeholder="https://space.bilibili.com/12345&#10;67890"></textarea></div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="pri" style="border:none;border-radius:10px;padding:8px 18px;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));font-family:inherit" onclick="checkFeed()">检查近14天更新</button>
    <span id="feedMsg" style="font-size:12.5px;color:var(--sub)"></span>
  </div>
  <div id="feedList" style="margin-top:14px;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px"></div>
  <div class="dlg-foot">
    <button onclick="feedDlg.close()">关闭</button>
    <button class="pri" id="feedBatchBtn" style="display:none" onclick="startBatchFromFeed()">批量总结选中项</button>
  </div>
  <div class="note" style="margin-top:14px">提示：追更检查需要登录态，请先在「设置」中填入 B站 SESSDATA。</div>
</dialog>

<dialog id="settingsDlg">
  <h3>设置</h3>
  <div class="frow"><label>服务商预设（自动填好地址与推荐模型）</label>
    <select id="cfg_provider" onchange="applyPreset()">
      <option value="siliconflow">硅基流动（国内快，推荐）</option>
      <option value="openai">OpenAI</option>
      <option value="custom">自定义</option>
    </select></div>
  <div class="frow"><label>API 地址</label>
    <input id="cfg_api_base" placeholder="https://api.siliconflow.cn/v1"></div>
  <div class="frow"><label>API Key（留空不修改；当前 <span id="keyNow">未配置</span>）</label>
    <input id="cfg_api_key" type="password" placeholder="sk-..."></div>
  <div class="frow"><label>模型名称（需支持音频输入）</label>
    <input id="cfg_model" placeholder="Qwen/Qwen3-Omni-30B-A3B-Instruct"></div>
  <div class="frow"><label>温度（0 ~ 1）</label>
    <input id="cfg_temperature" type="number" step="0.1" min="0" max="1" value="0.3"></div>
  <div class="frow"><label>B站 Cookie SESSDATA（可选；当前 <span id="sdNow">未配置</span>）</label>
    <input id="cfg_sessdata" type="password" placeholder="留空不修改"></div>
  <div class="dlg-foot">
    <button onclick="settingsDlg.close()">取消</button>
    <button class="pri" onclick="saveSettings()">保存设置</button>
  </div>
</dialog>

<script>
const $=id=>document.getElementById(id);
let currentTask=null,pollTimer=null,lastResult="",lastFileName="";

const PRESETS={
 siliconflow:{api_base:"https://api.siliconflow.cn/v1",model:"Qwen/Qwen3-Omni-30B-A3B-Instruct"},
 openai:{api_base:"https://api.openai.com/v1",model:"gpt-4o-audio-preview"},
 custom:{api_base:"",model:""}
};
function detectProvider(base){
  for(const k in PRESETS){if(k!=="custom"&&PRESETS[k].api_base===base)return k}
  return "custom";
}
function applyPreset(){

}

/* ---------- mini markdown ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tsToSec(ts){const p=ts.split(":").map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]}
function tsLinkify(html){
  // 当前是B站视频时，把 [mm:ss] / [h:mm:ss] 变成可点击跳转链接
  if(!window.curVideo||!window.curVideo.bvid)return html;
  return html.replace(/\[(\d{1,2}:\d{2}(?::\d{2})?)\]/g,(m,ts)=>{
    const v=window.curVideo;
    const t=tsToSec(ts);
    const href=`https://www.bilibili.com/video/${v.bvid}?p=${v.page||1}&t=${t}`;
    return `<a href="${href}" target="_blank" title="在B站打开 ${ts}" style="border-bottom:none;font-family:Consolas,monospace;font-size:.92em">[${ts}]</a>`;
  });
}
function inline(s){return s
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')}
function mdRender(src){
  const lines=esc(src).split(/\r?\n/);const out=[];let inList=false,inCode=false,ol=false;
  const closeList=()=>{if(inList){out.push("</ul>");inList=false;ol=false}};
  for(const raw of lines){
    const l=raw;
    if(/^```/.test(l.trim())){inCode=!inCode;closeList();out.push(inCode?"<pre><code>":"</code></pre>");continue}
    if(inCode){out.push(l+"\n");continue}
    if(/^\s*$/.test(l)){closeList();continue}
    let m=l.match(/^\s*(#{1,4})\s+(.*)$/);
    if(m){closeList();const lv=m[1].length;out.push(`<h${lv}>${inline(m[2])}</h${lv}>`);continue}
    m=l.match(/^\s*\d+\.\s+(.*)$/);
    if(m){if(!inList||!ol){closeList();out.push('<ul>');inList=true;ol=true}out.push(`<li>${inline(m[1])}</li>`);continue}
    m=l.match(/^\s*[-*]\s+(.*)$/);
    if(m){if(!inList){out.push("<ul>");inList=true}out.push(`<li>${inline(m[1])}</li>`);continue}
    if(/^&gt;\s?/.test(l)){closeList();out.push(`<blockquote>${inline(l.slice(4))}</blockquote>`);continue}
    if(/^---+$/.test(l.trim())){closeList();out.push("<hr>");continue}
    closeList();
    out.push(`<p>${inline(l)}</p>`);
  }
  closeList();
  return tsLinkify(out.join("\n"));
}

async function api(path,opts){
  const r=await fetch(path,opts);
  if(!r.ok){let msg="请求失败 "+r.status;try{msg=(await r.json()).detail||msg}catch(e){}
    if(r.status===402)openActivate(msg);  // 未激活/试用用尽 → 弹出页内激活窗
    throw new Error(msg)}
  return r.json();
}

let proState=null;
async function loadPro(){
  try{
    const r=await fetch("/api/pro/status");
    if(!r.ok)return;
    proState=await r.json();
  }catch(e){return}
  const chip=$("proChip");
  chip.style.display="";
  chip.classList.remove("warn","ok");
  if(proState.state==="licensed"){
    chip.textContent="已激活 · "+(proState.expiry||"");
    chip.classList.add("ok");
  }else if(proState.state==="trial"){
    chip.textContent="试用 · 剩 "+(proState.uses_left??0)+" 次";
  }else{
    chip.textContent="未激活 · 点此激活";
    chip.classList.add("warn");

}

  if(!proState)return;               // 开源版：无授权体系，不弹

async function doActivate(kind){
  const m=$("actMsg");
  const val=(kind==="order"?$("actOrder").value:$("actCode").value).trim();
  if(!val){m.textContent=kind==="order"?"请输入赞助订单号":"请输入激活码";m.style.color="var(--err)";return}
  m.textContent="正在激活…";m.style.color="var(--sub)";

    const ep=kind==="order"?"/api/pro/activate-afdian":"/api/pro/activate-code";
    const r=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:val})});
    const d=await r.json();

let pickedUrl="",lastParse=null;
window.curVideo=null;
async function start(){
  const url=$("url").value.trim();
  if(!url)return showErr("请先粘贴B站视频链接");
  showErr("");
  try{
    const info=await api("/api/parse",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    // 收藏夹 / 合集直达链接 → 批量选择器
    if(info.collection){
      showColPicker(info.collection.items,info.collection.title);
      return;
    }
    lastParse=info;window.curVideo={bvid:info.bvid,page:1};
    pickedUrl=url;
    const ps=info.pages||[];
    const pk=$("pagePicker");
    pk.style.display="none";
    let pkText="";
    if(ps.length>1){
      pkText=`「${info.title.slice(0,26)}」共 ${ps.length} 个分P`;
      $("pageSel").innerHTML=ps.map(p=>`<option value="${p.page}">P${p.page} ${esc((p.part||"").slice(0,28))}</option>`).join("");
    }
    const old=pk.querySelector(".seasonBatch");if(old)old.remove();
    if(info.season&&info.season.videos&&info.season.videos.length>1){
      pkText+=(pkText?" · ":"")+`属合集「${esc((info.season.title||"").slice(0,16))}」`;
      const b=document.createElement("button");
      b.className="alt seasonBatch";
      b.textContent=`批量总结整个合集(${info.season.count}支)`;
      b.onclick=()=>showColPicker(info.season.videos,info.season.title);
      pk.appendChild(b);
    }
    if(pkText){
      $("pageInfo").textContent=pkText;
      pk.style.display="flex";
      if(ps.length===1)await startRun(false);
    }else{
      await startRun(false);
    }
  }catch(e){showErr(e.message)}
}
function showColPicker(items,title){
  $("colInfo").textContent=`${title||""} 共 ${items.length} 项 · 已选 0 项（约需 ${Math.ceil(items.length*0.8)} 分钟）`;
  $("colList").innerHTML=items.map((v,i)=>`
    <label style="display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer">
      <input type="checkbox" data-i="${i}" checked onchange="colCount(${items.length})">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.title||v.bvid)}</span>
      ${v.duration?`<span style="color:var(--sub);font-size:11.5px;flex-shrink:0">${typeof v.duration==="number"?fmtDur(v.duration):esc(v.duration)}</span>`:""}
    </label>`).join("");
  window.colItems=items;
  colCount(items.length);
  $("colPicker").style.display="flex";
  $("pagePicker").style.display="none";
}
function colCount(n){const c=[...$("colList").querySelectorAll("input:checked")].length;$("colInfo").textContent=$("colInfo").textContent.replace(/共 \d+ 项 · 已选 \d+ 项.*$/,`共 ${n} 项 · 已选 ${c} 项`)}
function colSelectAll(){$("colList").querySelectorAll("input").forEach(c=>c.checked=!c.checked);colCount(window.colItems.length)}
function fmtDur(s){s=Math.round(s);const h=~~(s/3600),m=~~(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`}
async function startBatchFromPicker(){
  const sel=[...$("colList").querySelectorAll("input:checked")].map(c=>window.colItems[+c.dataset.i]);
  if(!sel.length)return showErr("请至少勾选一项");
  $("colPicker").style.display="none";
  await runBatch(sel);
}
async function runBatch(items){
  try{
    const d=await api("/api/start_batch",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({items:items.map(v=>({bvid:v.bvid,title:v.title})),style:$("styleSel").value})});
    window.curVideo=null;
    currentTask=d.task_id;
    $("resultCard").style.display="none";$("startBtn").disabled=true;
    setProgress({stage:"queue",percent:0,message:`批量 ${items.length} 支视频 · 排队中…`});
    pollTimer=setInterval(poll,800);
  }catch(e){showErr(e.message)}
}
async function uploadFile(file){
  showErr("");
  const fd=new FormData();
  fd.append("file",file);
  fd.append("style",$("styleSel").value);
  $("resultCard").style.display="none";$("startBtn").disabled=true;
  window.curVideo=null;
  setProgress({stage:"omni",percent:3,message:`上传「${file.name}」中…`});
  try{
    const r=await fetch("/api/start_file",{method:"POST",body:fd});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||("上传失败 "+r.status));
    currentTask=d.task_id;
    pollTimer=setInterval(poll,800);
  }catch(e){
    $("startBtn").disabled=false;$("progressCard").style.display="none";
    showErr(e.message);
  }
}
async function startRun(allPages){
  if(!pickedUrl)return;
  $("pagePicker").style.display="none";
  try{
    const body={url:pickedUrl,style:$("styleSel").value};
    if(!allPages)body.page=parseInt($("pageSel").value)||1;
    body.all_pages=!!allPages;
    const d=await api("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    currentTask=d.task_id;
    if(body.page)window.curVideo={bvid:lastParse.bvid,page:body.page};
    loadPro();  // 试用消耗后刷新徽标
    $("resultCard").style.display="none";
    $("startBtn").disabled=true;
    setProgress({stage:"queue",percent:0,message:"排队中…"});
    pollTimer=setInterval(poll,800);
  }catch(e){showErr(e.message)}
}

async function poll(){
  if(!currentTask)return;
  try{
    const t=await api("/api/task/"+currentTask);
    setProgress(t);
    if(t.status==="done"){
      clearInterval(pollTimer);currentTask=null;$("startBtn").disabled=false;
      $("progressCard").style.display="none";
      showResult(t.result);
    }else if(t.status==="error"||t.status==="stopped"){
      clearInterval(pollTimer);currentTask=null;$("startBtn").disabled=false;
      $("progressCard").style.display="none";
      showErr((t.status==="stopped"?"已取消":"失败")+"："+(t.error||"未知错误"));
    }
  }catch(e){}
}

async function loadDanmaku(res){
  const w=$("dmWrap");
  if(!res||!res.bvid){w.style.display="none";return}
  try{
    const d=await api(`/api/danmaku?bvid=${res.bvid}&cid=${res.cid||0}&duration=${res.duration_sec||0}`);
    if(!d.ok){w.style.display="none";return}
    w.style.display="block";
    $("dmTotal").textContent=`· 共 ${d.total} 条弹幕`;
    const mx=Math.max(...d.bins,1);
    $("dmStrip").innerHTML=d.bins.map((c,i)=>{
      const a=c/mx;
      return `<div style="flex:1;background:rgba(249,115,22,${(0.08+0.92*a).toFixed(2)})" title="${fmtDur(i*d.duration/d.bins.length)} · ${c}条" onclick="window.open('https://www.bilibili.com/video/${res.bvid}?t=${Math.round(i*d.duration/d.bins.length)}')"></div>`;
    }).join("");
    $("dmHot").textContent="高能："+d.hot.slice(0,3).map(h=>`${fmtDur(h.t)}(${h.count})`).join(" · ");
  }catch(e){w.style.display="none"}
}

/* ---------- 导出：思维导图 OPML / Anki 闪卡 ---------- */
/* 下载工具：立即 revokeObjectURL 会让下载失败（下载是异步启动的），必须延迟释放 */
function downloadBlob(text, mime, name, withBom) {
  const blob = new Blob([withBom ? "\ufeff" + text : text], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function exportOPML(){
  if(!lastResult)return alert("请先生成总结");
  // 解析标题为层级树（## 一句话总结 → ### 子节 …）
  const heads=[];
  for(const ln of lastResult.split(/\r?\n/)){
    const m=ln.match(/^(#{1,4})\s+(.+)$/);
    if(m)heads.push({lv:m[1].length,t:m[2].replace(/[*`]/g,"").slice(0,60)});
  }
  if(!heads.length)return alert("笔记中没有标题，无法生成导图");
  const q=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const root={lv:0,t:($("resultTitle").textContent||"拾光总结").slice(0,60),ch:[]};
  const st=[root];
  for(const h of heads){
    while(st.length>1&&st[st.length-1].lv>=h.lv)st.pop();
    const node={lv:h.lv,t:h.t,ch:[]};
    st[st.length-1].ch.push(node);st.push(node);
  }
  const ser=n=>n.ch.length
    ?`<outline text="${q(n.t)}">${n.ch.map(ser).join("")}</outline>`
    :`<outline text="${q(n.t)}"/>`;
  const opml=`<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0"><head><title>${q(root.t)}</title></head><body>\n${ser(root)}\n</body></opml>`;
  downloadBlob(opml, "text/x-opml;charset=utf-8",
    (lastFileName || "seeglow").replace(/\.md$/, "") + ".opml");
}
async function makeFlashcards(){
  if(!lastFileName)return alert("请先生成总结");
  const btn=$("cardBtn");btn.disabled=true;btn.textContent="生成中…";
  try{
    const d=await api("/api/flashcards",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({file:lastFileName,count:10})});
    const tsv=d.cards.map(c=>`${c.q.replace(/\t|\n/g," ")}\t${c.a.replace(/\t|\n/g," ")}`).join("\n");
    downloadBlob(tsv, "text/plain;charset=utf-8",
      (lastFileName || "seeglow").replace(/\.md$/, "") + "-闪卡.txt", true);
    alert(`已生成 ${d.cards.length} 张闪卡：文件可直接导入 Anki（分隔符为制表符）`);
  }catch(e){alert("闪卡生成失败："+e.message)}
  btn.disabled=false;btn.textContent="闪卡 .txt";
}

  settingsDlg.showModal();
  try{
    const d=await api("/api/config");
    const c=d.config||d;
    $("cfg_provider").value=detectProvider(c.api_base||"");
    $("cfg_api_base").value=c.api_base||"";
    $("cfg_model").value=c.model||"";
    $("cfg_temperature").value=c.temperature??0.3;
    $("keyNow").textContent=c.api_key_masked||"未配置";
    $("sdNow").textContent=c.has_sessdata?"已配置":"未配置";
  }catch(e){}
}

async function saveSettings(){
  const body={
    provider:$("cfg_provider").value,
    api_base:$("cfg_api_base").value.trim(),
    api_key:$("cfg_api_key").value.trim(),
    model:$("cfg_model").value.trim(),
    temperature:parseFloat($("cfg_temperature").value)||0.3,
    sessdata:$("cfg_sessdata").value.trim()
  };
  try{
    await api("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    settingsDlg.close();$("cfg_api_key").value="";$("cfg_sessdata").value="";
  }catch(e){alert("保存失败："+e.message)}
}

askCard.addEventListener("dragleave",()=>{askCard.style.borderColor="";askCard.style.background=""});
askCard.addEventListener("drop",e=>{

});
